name: Build OverlayBot APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fsSL "$CMDLINE_TOOLS_URL" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv /tmp/android-cli/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Download ECJ compiler
        run: |
          curl -fsSL "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar" -o tools/ecj.jar || \
          curl -fsSL "https://repo1.maven.org/maven2/org/eclipse/jdt/core/compiler/ecj/4.6.1/ecj-4.6.1.jar" -o tools/ecj.jar

      - name: Patch build paths for CI
        run: |
          mkdir -p tools/sdk/build-tools/34.0.0 tools/sdk/platforms/android-34
          cp -r $HOME/android-sdk/build-tools/34.0.0/* tools/sdk/build-tools/34.0.0/
          cp $HOME/android-sdk/platforms/android-34/android.jar tools/sdk/platforms/android-34/

      - name: Build APK
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlayBot-APK
          path: out/OverlayBot.apk
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/OverlayBot.apk
          generate_release_notes: true
